name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: rozpakuj
        run: |
          mkdir p
          unzip -q EasyBot-projekt-yarn-1.21.11.zip -d p
      - name: build
        working-directory: p
        run: |
          V=$(curl -s https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml | grep -o '1\.21\.11+build\.[0-9]*' | sort -V | tail -1)
          echo "Yarn: $V"
          sed -i "s|^\(\s*\)mappings .*|\1mappings \"net.fabricmc:yarn:$V:v2\"|" build.gradle
          grep -n mappings build.gradle
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: p/build/libs/*.jar
